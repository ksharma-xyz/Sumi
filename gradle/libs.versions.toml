[versions]
# AGP ↔ Gradle compatibility: https://developer.android.com/build/releases/gradle-plugin
agp = "9.1.0"
kotlin = "2.3.10"
java = "21"
android-compileSdk = "36"
android-minSdk = "28"
android-targetSdk = "36"
compose-multiplatform = "1.10.2"
material3 = "1.9.0"
androidx-lifecycle = "2.9.6"
activity-compose = "1.13.0"
core-ktx = "1.18.0"
appcompat = "1.7.1"
koin = "4.1.1"
ktor = "3.4.1"
sqldelight = "2.3.2"
nav3 = "1.0.0-alpha06"
compose-multiplatform-lifecycle = "2.10.0-beta01"
datastore = "1.1.4"
kotlinx-serialization = "1.10.0"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1-0.6.x-compat"
detekt = "1.23.8"
detektCompose = "0.4.27"
firebaseGitLive = "2.4.0"
firebaseBom = "34.11.0"
admob = "24.9.0"
billing = "9.0.0"
basic-ads = "1.1.0"
google-services = "4.4.4"
firebase-crashlytics-plugin = "3.0.6"

# Screenshot testing. These four move together — Roborazzi is coupled to the Compose and
# AGP versions, so bump them as a set and re-record baselines afterwards. This combination
# is the one already proven in KRAIL and Setu.
roborazzi = "1.59.0"
composablePreviewScanner = "0.8.2"
robolectric = "4.16.1"
junit = "4.13.2"
# androidx.compose.ui artifacts (ui-tooling, ui-test-*) are versioned together and are
# separate from the org.jetbrains.compose multiplatform artifacts above.
androidx-compose-ui = "1.10.6"

[libraries]
# Android
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

# Compose
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }

# Lifecycle
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "compose-multiplatform-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# DI
di-koinAndroid = { module = "io.insert-koin:koin-android", version.ref = "koin" }
di-koinComposeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
di-koinComposeViewmodelNav = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin" }
di-koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
di-koinCompose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# Navigation 3 (JetBrains — KMP)
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3" }
navigation3-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "compose-multiplatform-lifecycle" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# SQLDelight
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# DataStore
datastore-preferences = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

# Kotlinx
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Test
test-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
test-junit = { group = "junit", name = "junit", version.ref = "junit" }
test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-composeUiTestJunit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "androidx-compose-ui" }
# Without ui-test-manifest, ComponentActivity fails to resolve under Robolectric.
test-composeUiTestManifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "androidx-compose-ui" }

# Screenshot testing
# The androidx (not org.jetbrains.compose) ui-tooling artifact — ComposablePreviewScanner
# reads androidx.compose.ui.tooling.preview.Preview out of the bytecode.
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "androidx-compose-ui" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
# The :android scanner, NOT :common. The common one looks for
# org.jetbrains.compose.ui.tooling.preview.Preview and silently finds zero previews here.
preview-scanner-android = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }

# Firebase (GitLive KMP wrapper)
firebase-bom                 = { module = "com.google.firebase:firebase-bom",           version.ref = "firebaseBom" }
firebase-analytics           = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics         = { module = "com.google.firebase:firebase-crashlytics" }
firebase-gitLiveAnalytics    = { module = "dev.gitlive:firebase-analytics",             version.ref = "firebaseGitLive" }
firebase-gitLiveCrashlytics  = { module = "dev.gitlive:firebase-crashlytics",           version.ref = "firebaseGitLive" }

# AdMob
admob       = { module = "com.google.android.gms:play-services-ads",  version.ref = "admob" }
billing     = { module = "com.android.billingclient:billing-ktx",      version.ref = "billing" }
basic-ads   = { module = "app.lexilabs.basic:basic-ads",              version.ref = "basic-ads" }

# Detekt
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-compose = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "detektCompose" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }

# BuildLogic — only used inside gradle/build-logic/convention
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
google-services            = { id = "com.google.gms.google-services",    version.ref = "google-services" }
firebase-crashlyticsPlugin = { id = "com.google.firebase.crashlytics",   version.ref = "firebase-crashlytics-plugin" }
# Must be applied in the module's plugins {} block, not only added as a dependency —
# otherwise the record/verify tasks are never registered and there is no error to notice.
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# Convention plugins
sumi-android-application = { id = "sumi.android.application", version = "unspecified" }
sumi-compose-multiplatform = { id = "sumi.compose.multiplatform", version = "unspecified" }
sumi-android-kmp-library = { id = "sumi.android.kmp.library", version = "unspecified" }
sumi-kotlin-multiplatform = { id = "sumi.kotlin.multiplatform", version = "unspecified" }
