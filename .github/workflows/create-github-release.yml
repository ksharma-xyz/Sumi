name: Create GitHub Release

# Triggered automatically when a final version tag (v1.0.0) is pushed.
# RC tags (v1.0.0-RC1) are excluded — they are informational only.
#
# Can also be triggered manually or called from another workflow.

on:
  push:
    tags:
      - 'v[0-9]*'        # matches v1.0.0, v1.0.0-RC1, etc.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip RC tags when triggered by a push (release-2-deploy-rc pushes v*-RC* tags).
    # workflow_call / workflow_dispatch always run — callers are responsible for filtering.
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '-RC') }}
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          # PAT_SUMI_GITHUB returned 403 "Resource not accessible by integration"
          # on release creation, so use the job token instead. The contents: write
          # permission above is all a release needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          draft: true
