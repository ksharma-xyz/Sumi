name: Code Quality

on:
  workflow_call:
    outputs:
      detekt-passed:
        description: "Whether Detekt checks passed"
        value: ${{ jobs.detekt.outputs.passed }}
      snapshots-passed:
        description: "Whether snapshot baselines matched"
        value: ${{ jobs.snapshots.outputs.passed }}

jobs:
  detekt:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.detekt.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Detekt
        id: detekt
        run: ./gradlew detekt

      - name: Upload Detekt reports
        if: always() && steps.detekt.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports-${{ github.run_id }}
          path: |
            **/build/reports/detekt/detekt.html
            **/build/reports/detekt/detekt.xml
            **/build/reports/detekt/detekt.md
            **/build/reports/detekt/detekt.txt
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 7

  snapshots:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.verify.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Baselines are stored in Git LFS; without this the checkout leaves pointer
          # files behind and every comparison fails for the wrong reason.
          lfs: true
          # darpan is a composite build via git submodule until it is published to Central.
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads a per-SDK android-all jar on first use. Uncached that dominates
      # the job: the first run of this workflow took 16 minutes, most of it here.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-sdk34
          restore-keys: robolectric-${{ runner.os }}-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify snapshots
        id: verify
        run: ./gradlew :composeApp:verifyRoborazziAndroidHostTest

      - name: Upload snapshot diffs
        if: always() && steps.verify.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-${{ github.run_id }}
          path: |
            composeApp/build/outputs/roborazzi/**
            composeApp/build/reports/roborazzi/**
          if-no-files-found: ignore
          retention-days: 7
