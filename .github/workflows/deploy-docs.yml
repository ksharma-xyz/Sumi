name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/index.html'
      - 'docs/privacy-policy/**'
      - 'docs/assets/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install ghp-import
        run: |
          python3 -m pip install --upgrade pip
          pip install ghp-import

      # Stage just the public site — keep the rest of docs/ (handoff/, design
      # notes) out of the published bundle. Static HTML, no build step.
      - name: Stage public site
        run: |
          mkdir -p _site/privacy-policy _site/assets
          cp docs/index.html _site/
          cp docs/privacy-policy/index.html _site/privacy-policy/
          cp -R docs/assets/. _site/assets/
          # .nojekyll stops GitHub Pages from running its Jekyll pass — we ship
          # plain HTML/CSS so Jekyll would only slow the deploy down.
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        run: ghp-import -n -p -f _site
